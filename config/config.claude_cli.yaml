# Test config WITHOUT an API key: judgment delegated to the `claude` CLI (Claude Code subscription).
llm:
  provider: claude_cli
  model: "sonnet"             # CLI alias (claude-sonnet-5); "opus"/"haiku" also possible
  temperature: 0
  cli_timeout: 300
  max_doc_chars: 24000

judge:
  section_chars: 8000
  section_overlap: auto

paths:
  workdir: "./workdir"

thresholds:
  coverage_flag_below: 0.7

parsing:
  parser: docling
  docling_batch_pages: 1     # 1-page batch = peak RSS ~1.1 GB, safe under ~1.2 GB; increase on a machine with comfortable RAM

enrichment:
  enabled: false             # image VLM via the CLI is out of scope for this test
  min_side_pts: 24.0
  vlm:
    provider: mock
    model: "sonnet"
    api_key_env: "CQG_LLM_API_KEY"
    manifest_path: "workdir/image_manifest.json"

golden:
  profile: "conseiller / gestionnaire AXA"
  policy: |
    Repondre uniquement a partir du document. Citer la source. Si l'information n'est pas
    presente, repondre 'Non couvert par le document'.
  n_questions: auto
  corpus_level: true
  k: 6
  chunk_chars: 1000
  chunk_overlap: 100
